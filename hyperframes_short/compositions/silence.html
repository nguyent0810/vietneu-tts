<!doctype html>
<html lang="vi" data-resolution="portrait" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#6b7f72"},
  {"id":"kicker","type":"string","label":"Kicker","default":"SUY NGẪM"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Chung cho mọi trường phái BUD: thanh tiến trình gần như vô hình, chữ
     phụ đề đặt cao hơn để khung dưới rộng rãi. */
  .progress { height: 3px; opacity: .35; box-shadow: none; }
  #capzone { bottom: 250px; }

  /* ===== TĨNH LẶNG: gần như không có gì, và đó là chủ ý ===== */
  #bed { background: #08090a; }
  #hair { background: linear-gradient(180deg, rgba(0,0,0,0) 0 640px,
          rgba(150,170,160,.16) 640px 641px, rgba(0,0,0,0) 641px); }
  .grain { opacity: .09; }
  #kicker { color: #8c968f; } #footer { color: #4b524e; }
  .progress { background: rgba(140,160,150,.35); box-shadow: none; }
  .sil-wrap { position: absolute; left: 130px; right: 130px; top: 700px; }
  .sil-key { font-weight: 600; font-size: 82px; line-height: 1.22; color: #e6ebe8;
             letter-spacing: -.015em; }
  .sil-key.long { font-size: 66px; } .sil-key.xlong { font-size: 54px; }
  .sil-dot { margin-top: 54px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .mv-grade { background: linear-gradient(180deg, rgba(8,9,10,.82) 0%, rgba(8,9,10,.5) 26%,
              rgba(8,9,10,.66) 64%, rgba(8,9,10,.9) 100%); }
  .mv-slug { position: absolute; left: 130px; top: 1160px; font-size: 21px; color: #8c968f; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <div class="bedrock" id="hair"></div>
  <svg class="bedrock grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-still"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script>
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "sil-wrap card-box");
    const key = HF.el("div", "sil-key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 28) key.classList.add("xlong"); else if (L > 15) key.classList.add("long");
    w.appendChild(key);
    w.appendChild(HF.el("div", "sil-dot"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".sil-key"), { opacity: 0 },
      { opacity: 1, duration: 1.4, ease: "sine.out" }, ln.start);
    tl.fromTo(inner.querySelector(".sil-dot"), { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: .8, ease: "sine.out" }, ln.start + .7);
  },
  transition(tl, oldS, newS, T) {
    tl.to(oldS, { opacity: 0, duration: 1.0, ease: "sine.inOut" }, T);
    tl.fromTo(newS, { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "sine.inOut" }, T + .35);
  },
  ambient(tl, DUR) {
    tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0 }, { opacity: 1, duration: 1.6 }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .8, duration: 1.6 }, .5);
    tl.fromTo("#hair", { opacity: 0 }, { opacity: 1, duration: DUR * .5, ease: "none" }, 0);
  },
  buildMediaScene(inner, ln) {
    inner.appendChild(HF.el("div", "mv-grade"));
    inner.appendChild(HF.el("div", "mv-slug", "HÌNH MINH HOẠ"));
  },
  enterMedia(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".mv-grade"), { opacity: 0 }, { opacity: 1, duration: 1.0 }, ln.start);
  },
};
HF.build();
</script>
</body>
</html>
