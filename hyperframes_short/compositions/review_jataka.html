<style>

     Lớp 1: canvas WebGL (trời, sao, trăng 3D, lửa hạt, sông). Lớp 2: SVG nhân vật/đạo cụ. Lớp 3: chữ.
     Không vẽ mặt Đức Phật (nhân vật chính là Bồ Tát trong kiếp thỏ / khỉ). */
  html, body { margin: 0; background: #0b1024; }

  #art { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #tag { position: absolute; left: 0; right: 0; top: 96px; text-align: center; }
  #tag span { display: inline-block; padding: 10px 26px; border-radius: 40px; border: 2px solid rgba(255,222,150,.7);

  #hook { position: absolute; left: 50px; right: 50px; top: 170px; text-align: center; font-weight: 900; font-size: 98px; line-height: 1.02;
          color: #fff3d6; text-shadow: 0 6px 0 rgba(20,10,0,.55), 0 0 40px rgba(255,170,60,.55); letter-spacing: -.01em; }
  #hook .g { color: #ffc75a; }
  #label { position: absolute; left: 40px; right: 40px; top: 1450px; text-align: center; font-weight: 900; font-size: 76px; white-space: nowrap; color: #ffd36b;
           text-shadow: 0 5px 0 rgba(30,12,0,.5), 0 0 34px rgba(255,190,90,.5); opacity: 0; }
  #cap { position: absolute; left: 60px; right: 60px; top: 1570px; text-align: center; font-weight: 800; font-size: 62px; line-height: 1.18;
         color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 26px rgba(0,0,0,.65); }

  #foot { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; color: rgba(255,230,180,.7); font-size: 26px; font-weight: 600; letter-spacing: .04em; }

<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
  const DATA = __DATA__;
  const DUR = DATA.dur, S = DATA.segs, STORY = DATA.story;
  const W = 1080, H = 1920, NS = "http://www.w3.org/2000/svg";
  const T = (i) => S[i].start, TE = (i) => S[i].end;
  // thời điểm của một từ trong câu i (trải đều theo số từ)
  const wt = (i, w, nth = 1) => { const ws = S[i].text.split(/\s+/); let k = -1, seen = 0;
    ws.forEach((x, j) => { if (k < 0 && x.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "").startsWith(w) && ++seen === nth) k = j; });
    return S[i].start + (S[i].end - S[i].start) * Math.max(k, 0) / ws.length; };
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ================= THREE =================
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200); cam.position.set(0, 0, 20);
  const VIEW_H = 2 * Math.tan(THREE.MathUtils.degToRad(20)) * 20, VIEW_W = VIEW_H * W / H;   // kích thước khung ở z=0
  const px = (x, y) => new THREE.Vector3((x / W - .5) * VIEW_W, (.5 - y / H) * VIEW_H, 0);    // toạ độ SVG -> thế giới (z=0)

  const sky = new THREE.Mesh(new THREE.PlaneGeometry(VIEW_W * 1.6, VIEW_H * 1.6), new THREE.ShaderMaterial({
    uniforms: { top: { value: new THREE.Color("#0a0f2e") }, mid: { value: new THREE.Color("#283070") }, bot: { value: new THREE.Color("#c26a3a") }, warm: { value: 0 } },
    vertexShader: "varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: `varying vec2 v; uniform vec3 top, mid, bot; uniform float warm;
      void main(){ float y=v.y; vec3 c=mix(bot,mid,smoothstep(.18,.55,y)); c=mix(c,top,smoothstep(.55,.95,y));
        c+= warm*vec3(.25,.12,.02)*(1.-smoothstep(.05,.45,y)); gl_FragColor=vec4(c,1.); }` }));
  sky.position.z = -30; sky.scale.setScalar(2.6); scene.add(sky);

  // sao (nhấp nháy theo thời gian, tất định)
  const NST = 700, sp = new Float32Array(NST * 3), sph = new Float32Array(NST);
  for (let i = 0; i < NST; i++) { sp[i * 3] = (rnd() - .5) * 60; sp[i * 3 + 1] = (rnd() - .2) * 70; sp[i * 3 + 2] = -28; sph[i] = rnd() * 6.28; }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3)); sg.setAttribute("ph", new THREE.BufferAttribute(sph, 1));
  const starMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { t: { value: 0 }, a: { value: 1 } },
    vertexShader: "attribute float ph; uniform float t; varying float k; void main(){ k=.45+.55*sin(ph+t*1.7); gl_PointSize=2.+3.*k; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying float k; uniform float a; void main(){ float d=length(gl_PointCoord-.5); gl_FragColor=vec4(vec3(1.,.95,.85), a*k*smoothstep(.5,.0,d)); }" });
  scene.add(new THREE.Points(sg, starMat));

  // mặt trăng: cầu + vân miệng núi (nhiễu giá trị trong shader) + quầng
  const moonMat = new THREE.ShaderMaterial({ uniforms: { glow: { value: 1 } },
    vertexShader: "varying vec3 n; varying vec3 p; void main(){ n=normalize(normalMatrix*normal); p=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: `varying vec3 n; varying vec3 p; uniform float glow;
      float h(vec3 q){ return fract(sin(dot(q,vec3(12.9898,78.233,45.164)))*43758.5453); }
      float vn(vec3 q){ vec3 i=floor(q), f=fract(q); f=f*f*(3.-2.*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
      void main(){ float m=vn(p*1.6)*.55+vn(p*3.4)*.3+vn(p*8.)*.15; float l=clamp(dot(n,normalize(vec3(-.4,.35,.85))),0.,1.);
        vec3 c=mix(vec3(.93,.9,.82),vec3(.7,.68,.66),smoothstep(.45,.7,m)); c*=.35+.75*l; c+=vec3(.08,.07,.04)*glow;
        gl_FragColor=vec4(c,1.); }` });
  const moon = new THREE.Mesh(new THREE.SphereGeometry(2.4, 96, 96), moonMat); scene.add(moon);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { a: { value: .8 } },
    vertexShader: "varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying vec2 v; uniform float a; void main(){ float d=length(v-.5)*2.; gl_FragColor=vec4(vec3(1.,.93,.75), a*.55*pow(max(1.-d,0.),2.6)); }" }));
  halo.position.z = -.5; moon.add(halo);

  // lửa hạt: mỗi hạt có hạt giống, vị trí tính từ thời gian (bay lên, lắc), màu lerp ấm -> băng
  function makeFire(n, scale) {
    const g = new THREE.BufferGeometry(), a = new Float32Array(n * 3), sd = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { sd[i * 3] = rnd(); sd[i * 3 + 1] = rnd(); sd[i * 3 + 2] = rnd(); }
    g.setAttribute("position", new THREE.BufferAttribute(a, 3)); g.setAttribute("sd", new THREE.BufferAttribute(sd, 3));
    const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { t: { value: 0 }, ice: { value: 0 }, amp: { value: 1 }, sc: { value: scale } },
      vertexShader: `attribute vec3 sd; uniform float t, amp, sc; varying float life; varying float hot;
        void main(){ float life0=fract(sd.x+t*(.55+.5*sd.y)); life=life0;
          vec3 q=vec3((sd.z-.5)*1.1*(1.-life0*.6)+sin(t*3.+sd.x*20.)*.12*life0, life0*3.2, 0.)*sc*amp;

    say("AN VUI CỦA TẤT CẢ", wt(7, "an"), TE(7) + .2);
    // câu 8: hỏi -> quay về cầu (khung đầu) để lặp
    const L = T(8);
    tl.to([king, held], { opacity: 0, duration: .4 }, L); tl.to(st, { warm: 0, duration: .6 }, L);
    tl.to(bridgeBody, { attr: { d: "M640,860 C710,842 800,842 870,856" }, duration: .01 }, L);
    tl.to(bamboo, { attr: { x2: 640, y2: 860 }, opacity: 1, duration: .5 }, L + .2); tl.to(bridge, { opacity: 1, duration: .5 }, L + .2);
    crossers.forEach((g, k) => tl.fromTo(g, { opacity: 0, x: 690 - k * 70 - 200, y: 812 }, { opacity: 1, x: 690 - k * 70, y: 812, duration: DUR - L - .2, ease: "none" }, L + .2));
    tl.to(hook, { opacity: 1, y: 0, duration: .5 }, DUR - .6);
  }

  (STORY === "bud_tho" ? storyHare : storyMonkey)();

  // ================= PHỤ ĐỀ (cụm <= 6 từ, hiện theo lời) =================
  const chunks = [];
  S.forEach((sg) => { const ws = sg.text.split(/\s+/); const per = (sg.end - sg.start) / ws.length; let k = 0;
    while (k < ws.length) { const n = Math.min(6, ws.length - k); const words = ws.slice(k, k + n).map((w, i) => ({ w, t: sg.start + per * (k + i) }));
      chunks.push({ words, t0: sg.start + per * k, t1: k + n >= ws.length ? sg.end + .15 : sg.start + per * (k + n) }); k += n; } });
  const HOT = /(lửa|thỏ|mặt trăng|chính|băng|đế|thích|cầu|khỉ|lưng|tre|vua|an vui|316|407)/i;

  tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
    const t = st.t;
    starMat.uniforms.t.value = t; fires.forEach((f) => (f.material.uniforms.t.value = t)); river.material.uniforms.t.value = t;
    sky.material.uniforms.warm.value = st.warm || 0;
    moon.rotation.y = .3 + t * .05;
    renderer.render(scene, cam);
    const c = chunks.find((c) => t >= c.t0 - .04 && t < c.t1);
    if (c) { if (cap._c !== c) { cap._c = c; cap.innerHTML = c.words.map((w) => `<span class="w${HOT.test(w.w) ? " hot" : ""}" data-t="${w.t}">${w.w}</span>`).join(" "); }
      cap.querySelectorAll(".w").forEach((e) => e.classList.toggle("on", +e.dataset.t <= t + .03)); cap.style.opacity = 1; }
    else cap.style.opacity = 0;
  } }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
