<!doctype html>
<html lang="vi" data-resolution="landscape" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#e2b441"},
  {"id":"kicker","type":"string","label":"Kicker","default":"PHONG THỦY"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"},
  {"id":"kc","type":"string","label":"Kinetic v2","default":""},
  {"id":"seg_off","type":"number","label":"Chapter offset (s)","default":0},
  {"id":"seg_total","type":"number","label":"Whole video (s)","default":0}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./wide.css" />
<link rel="stylesheet" href="./longform.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===== SƠN MÀI: nền đỏ son – đen, khung vàng kim, hoa văn mây góc =====
     Skin thứ hai của kênh Phong Thủy (luân phiên với la bàn đêm). Không chữ, không quẻ trên nền. */
  #capzone { bottom: 64px; }
  .progress { height: 4px; background: var(--accent); opacity: .75; box-shadow: 0 0 22px var(--accent); }
  #bed { background: radial-gradient(110% 85% at 50% 42%, #4a0f0c 0%, #2a0706 52%, #120202 100%); }
  #frame { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
  .grain { opacity: .14; }
  #kicker { color: #f1d9a0; } #footer { color: #c9a99a; }
  .lb-wrap { position: absolute; left: 240px; right: 240px; top: 170px; height: 600px;
             display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .lb-key { font-weight: 800; font-size: 92px; line-height: 1.12; color: #f6e7c8; text-shadow: 0 0 60px rgba(226,180,65,.25), 0 22px 60px rgba(0,0,0,.8); }
  .lb-key.long { font-size: 76px; } .lb-key.xlong { font-size: 60px; }
  .lb-rule { width: 0; height: 3px; margin: 34px auto 0; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
  .mv-arch { position: absolute; left: 520px; top: 70px; width: 880px; height: 760px; border-radius: 440px 440px 18px 18px; pointer-events: none;
             box-shadow: 0 0 0 9999px #1a0404, inset 0 0 70px rgba(26,4,4,.85); }
  .mv-archline { position: absolute; left: 504px; top: 54px; width: 912px; height: 792px; border-radius: 456px 456px 26px 26px; border: 3px solid var(--accent);
             box-shadow: 0 0 30px rgba(226,180,65,.35); pointer-events: none; opacity: .9; }
  :root { --lf-theme: night; --lf-skin: lacquer; --lf-fg: #f6e7c8; --lf-muted: #d2ae9c; --lf-panel: rgba(58, 12, 10, .9); --lf-edge: rgba(226, 180, 65, .4); --lf-line: rgba(226, 180, 65, .55); --lf-shade: 26, 4, 4; --lf-node: #2c0807; --lf-led-flash: rgba(226,180,65,.22); --kc-blob-a: rgba(226,180,65,.16); --kc-blob-b: rgba(211,58,44,.18); --flap-bg: #2a0606; --lk-row: rgba(255,220,170,.05); --lk-row-bd: rgba(226,180,65,.24); --rl-stage: radial-gradient(ellipse at 50% 45%, #4a100d 0%, #140303 78%); --an-desk: radial-gradient(ellipse at 50% 40%, #4a100d 0%, #140303 75%); --cl-board: radial-gradient(ellipse at 50% 40%, #3c0d0b 0%, #160404 80%); --dl-bub2: rgba(226,180,65,.16); --wd-leaf: rgba(226,180,65,.55); --bg8-dong: #e2b441; --bg8-tay: #e0533d; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <svg id="frame" viewBox="0 0 1920 1080"><g fill="none" stroke="#e2b441"><rect x="38" y="38" width="1844" height="1004" stroke-width="3"/><rect x="52" y="52" width="1816" height="976" stroke-width="1"/>
    <g id="corner"><path d="M52,170 C52,100 100,52 170,52" stroke-width="2"/><path d="M80,140 C86,104 104,86 140,80" stroke-width="2"/><circle cx="110" cy="110" r="12" stroke-width="2"/></g>
    <use href="#corner" transform="translate(1920,0) scale(-1,1)"/><use href="#corner" transform="translate(0,1080) scale(1,-1)"/><use href="#corner" transform="translate(1920,1080) scale(-1,-1)"/></g>
    <circle id="sun" cx="960" cy="470" r="330" fill="#e2b441" opacity=".05"/></svg>
  <svg class="bedrock grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="4"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-gold"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script src="./longform.js"></script>
<script>
function ticks(svg, r, n, len, w) {
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", c * r); l.setAttribute("y1", s * r);
    l.setAttribute("x2", c * (r - len)); l.setAttribute("y2", s * (r - len));
    l.setAttribute("stroke", "#d4a93a"); l.setAttribute("stroke-width", w);
    svg.appendChild(l);
  }
}
function ring(svg, r, w, dash) {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("r", r); c.setAttribute("fill", "none"); c.setAttribute("stroke", "#d4a93a");
  c.setAttribute("stroke-width", w); if (dash) c.setAttribute("stroke-dasharray", dash);
  svg.appendChild(c);
}
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "lb-wrap card-box");
    const key = HF.el("div", "lb-key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 28) key.classList.add("xlong"); else if (L > 15) key.classList.add("long");
    w.appendChild(key);
    w.appendChild(HF.el("div", "lb-rule"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".lb-key"), { opacity: 0, scale: .94 },
      { opacity: 1, scale: 1, duration: .8, ease: "power2.out" }, ln.start);
    tl.fromTo(inner.querySelector(".lb-rule"), { width: 0 },
      { width: 220, duration: .9, ease: "power2.out" }, ln.start + .25);
  },
  transition(tl, oldS, newS, T) {
    tl.to(oldS, { opacity: 0, scale: 1.04, duration: .55, ease: "power1.in" }, T);
    tl.fromTo(newS, { opacity: 0 }, { opacity: 1, duration: .6, ease: "power1.out" }, T + .2);
  },
  ambient(tl, DUR, ctx) {
    // Render theo chương: thanh tiến trình chạy theo CẢ video (seg_off / seg_total), không reset mỗi chương.
    const V = (ctx && ctx.V) || {}, TOT = Number(V.seg_total) || DUR, OFF = Number(V.seg_off) || 0;
    tl.fromTo("#progress", { width: 1920 * OFF / TOT }, { width: 1920 * Math.min(1, (OFF + DUR) / TOT), duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .9, duration: 1.0 }, .3);
    // Sơn mài: vầng sáng vàng phía sau "thở" rất chậm, khung vàng lấp lánh nhẹ.
    tl.fromTo("#sun", { attr: { r: 300 }, opacity: .04 }, { attr: { r: 360 }, opacity: .08, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#frame", { opacity: .35 }, { opacity: .55, duration: Math.min(DUR, 6), yoyo: true, repeat: Math.max(0, Math.floor(DUR / 6) - 1), ease: "sine.inOut" }, 0);
  },
  buildMediaScene(inner, ln) {
    inner.appendChild(HF.el("div", "mv-arch"));
    inner.appendChild(HF.el("div", "mv-archline"));
  },
  enterMedia(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".mv-archline"), { opacity: 0, scale: 1.04 }, { opacity: .9, scale: 1, duration: 1.0, ease: "power2.out" }, ln.start);
  },
};
HF.build();
</script>
</body>
</html>
