<!doctype html>
<html lang="vi" data-resolution="landscape" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#f0a35e"},
  {"id":"kicker","type":"string","label":"Kicker","default":"PHẬT GIÁO"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"},
  {"id":"kc","type":"string","label":"Kinetic v2","default":""},
  {"id":"seg_off","type":"number","label":"Chapter offset (s)","default":0},
  {"id":"seg_total","type":"number","label":"Whole video (s)","default":0}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./wide.css" />
<link rel="stylesheet" href="./longform.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===== THAN HỒNG: đêm than ấm, lửa âm ỉ dưới đáy, đốm tro bay lên chậm =====
     Skin thứ ba của kênh Phật Giáo (luân phiên với giấy mực và trăng thiền). */
  #capzone { bottom: 64px; }
  .progress { height: 4px; background: var(--accent); opacity: .7; box-shadow: 0 0 20px var(--accent); }
  #bed { background: radial-gradient(130% 90% at 50% 110%, #4e2012 0%, #26110b 42%, #110807 100%); }
  #glow { position: absolute; left: 160px; right: 160px; bottom: -260px; height: 520px; border-radius: 50%; filter: blur(70px);
          background: radial-gradient(ellipse at 50% 50%, rgba(240,130,60,.42), rgba(240,130,60,0) 70%); }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffc27a; box-shadow: 0 0 10px 3px rgba(255,150,70,.7); opacity: 0; }
  .grain { opacity: .1; }
  #kicker { color: #f3dccb; } #footer { color: #c9ab98; }
  .em-wrap { position: absolute; left: 240px; right: 240px; top: 170px; height: 600px;
             display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .em-key { font-weight: 800; font-size: 92px; line-height: 1.12; color: #fbeee2; text-shadow: 0 0 50px rgba(240,140,70,.28), 0 22px 60px rgba(0,0,0,.8); }
  .em-key.long { font-size: 76px; } .em-key.xlong { font-size: 60px; }
  .em-rule { width: 0; height: 3px; margin: 34px auto 0; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
  .mv-ember { position: absolute; left: 290px; top: 70px; width: 1340px; height: 760px; border-radius: 26px; pointer-events: none;
              box-shadow: 0 0 0 9999px #140907, inset 0 0 80px 24px rgba(20,9,7,.85), 0 0 60px 6px rgba(240,140,70,.25); }
  .bg8-mkc { stroke: #ffe1c2; }
  :root { --lf-theme: night; --lf-skin: ember; --lf-fg: #fbeee2; --lf-muted: #d1b2a0; --lf-panel: rgba(40, 18, 12, .9); --lf-edge: rgba(240, 163, 94, .35);
          --lf-line: rgba(240, 163, 94, .5); --lf-shade: 18, 8, 7; --lf-node: #2a120b; --lf-led-flash: rgba(240,163,94,.2);
          --kc-blob-a: rgba(240,163,94,.14); --kc-blob-b: rgba(255,220,180,.1); --flap-bg: #24100a; --lk-row: rgba(255,255,255,.04); --lk-row-bd: rgba(240,163,94,.22);
          --rl-stage: radial-gradient(ellipse at 50% 45%, #4a2014 0%, #120807 78%); --an-desk: radial-gradient(ellipse at 50% 40%, #4a2014 0%, #120807 75%);
          --cl-board: radial-gradient(ellipse at 50% 40%, #3a1a10 0%, #120807 80%); --dl-bub2: rgba(240,163,94,.14); --wd-leaf: rgba(255,170,90,.55);
          --bg8-dong: #f0c27a; --bg8-tay: #e0785a; --marker: rgba(255,210,160,.4); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <div id="glow"></div>
  <div id="sparks"></div>
  <svg class="bedrock grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-gold"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script src="./longform.js"></script>
<script>
// Đốm tro: vị trí/nhịp cố định (không Math.random) để render lại ra y hệt.
const SPARKS = [[180, 9, 0], [420, 12, 3], [610, 10, 6], [830, 14, 1.5], [1010, 11, 7.5], [1240, 13, 4], [1460, 9.5, 2], [1680, 12.5, 8], [300, 15, 10], [1120, 10.5, 11], [1560, 14, 5.5], [720, 11.5, 12]];
const sparkBox = document.getElementById("sparks");
SPARKS.forEach(([x]) => { const s = HF.el("div", "spark"); s.style.left = x + "px"; s.style.top = "1060px"; sparkBox.appendChild(s); });
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "em-wrap card-box");
    const key = HF.el("div", "em-key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 28) key.classList.add("xlong"); else if (L > 15) key.classList.add("long");
    w.appendChild(key);
    w.appendChild(HF.el("div", "em-rule"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    // chữ nguội dần: từ đỏ cam sang trắng ấm
    tl.fromTo(inner.querySelector(".em-key"), { opacity: 0, color: "#ff9a4a", y: 16 },
      { opacity: 1, color: "#fbeee2", y: 0, duration: 1.1, ease: "power2.out" }, ln.start);
    tl.fromTo(inner.querySelector(".em-rule"), { width: 0 }, { width: 220, duration: .9, ease: "power2.out" }, ln.start + .25);
  },
  transition(tl, oldS, newS, T) {
    tl.to(oldS, { opacity: 0, y: -20, duration: .55, ease: "power1.in" }, T);
    tl.fromTo(newS, { opacity: 0 }, { opacity: 1, duration: .6, ease: "power1.out" }, T + .2);
  },
  ambient(tl, DUR, ctx) {
    const V = (ctx && ctx.V) || {}, TOT = Number(V.seg_total) || DUR, OFF = Number(V.seg_off) || 0;
    tl.fromTo("#progress", { width: 1920 * OFF / TOT }, { width: 1920 * Math.min(1, (OFF + DUR) / TOT), duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .9, duration: 1.0 }, .3);
    // lửa âm ỉ thở chậm; đốm tro bay lên rồi tắt
    tl.fromTo("#glow", { opacity: .7, scale: 1 }, { opacity: 1, scale: 1.08, duration: 5, yoyo: true, repeat: Math.max(0, Math.floor(DUR / 5) - 1), ease: "sine.inOut" }, 0);
    const els = document.querySelectorAll(".spark");
    SPARKS.forEach(([x, period, delay], k) => {
      const n = Math.max(1, Math.ceil((DUR - delay) / period));
      for (let r = 0; r < n; r++) {
        const t = delay + r * period; if (t >= DUR) break;
        tl.fromTo(els[k], { y: 0, x: 0 }, { y: -900 - (k % 4) * 60, x: (k % 2 ? 1 : -1) * (30 + (k % 5) * 14), duration: period * .9, ease: "none" }, t);
        tl.fromTo(els[k], { opacity: 0 }, { opacity: .9, duration: period * .15, ease: "none" }, t);
        tl.to(els[k], { opacity: 0, duration: period * .45, ease: "none" }, t + period * .4);
      }
    });
  },
  buildMediaScene(inner, ln) {
    inner.appendChild(HF.el("div", "mv-ember"));
  },
  enterMedia(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".mv-ember"), { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "power2.out" }, ln.start);
  },
};
HF.build();
</script>
</body>
</html>
