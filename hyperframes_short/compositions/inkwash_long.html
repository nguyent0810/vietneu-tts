<!doctype html>
<html lang="vi" data-resolution="landscape" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#8c2f22"},
  {"id":"kicker","type":"string","label":"Kicker","default":"SUY NGẪM"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./wide.css" />
<link rel="stylesheet" href="./longform.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Chung cho mọi trường phái BUD: thanh tiến trình gần như vô hình, chữ
     phụ đề đặt cao hơn để khung dưới rộng rãi. */
  .progress { height: 3px; opacity: .35; box-shadow: none; }
  #capzone { bottom: 250px; }

  /* ===== THUỶ MẶC: nền giấy dó, mực loang chậm, một dấu son ===== */
  #root { color: #23201b; }
  #bed { background: radial-gradient(120% 80% at 50% 20%, #f3eee2 0%, #e9e2d2 55%, #ded5c2 100%); }
  #blot { background: radial-gradient(38% 26% at 34% 44%, rgba(24,22,20,.38), rgba(24,22,20,0) 70%);
          filter: blur(28px); }
  .grain { opacity: .22; mix-blend-mode: multiply; }
  #edge { box-shadow: inset 0 0 220px rgba(120,105,80,.35); }
  #kicker { color: #4a4238; } #badge { color: var(--accent); }
  #footer { color: #7d7364; }
  #kicker-row .bar { background: var(--accent); box-shadow: none; }
  .progress { background: rgba(35,32,27,.4); }
  .ink-wrap { position: absolute; left: 110px; right: 110px; top: 470px; height: 700px;
              display: flex; flex-direction: column; justify-content: center; }
  .ink-key { font-weight: 800; font-size: 104px; line-height: 1.12; color: #1d1a16; letter-spacing: -.02em; }
  .ink-key.long { font-size: 80px; } .ink-key.xlong { font-size: 62px; }
  .ink-seal { margin-top: 54px; width: 84px; height: 84px; background: var(--accent);
              color: #f3eee2; font-weight: 800; font-size: 34px; display: flex;
              align-items: center; justify-content: center; letter-spacing: -.02em; }
  .mv-mat { position: absolute; inset: 0; border-style: solid; border-color: #e9e2d2;
            border-width: 300px 130px 760px 130px; }
  /* Cạnh cắt thẳng tắp nhìn cứng như ảnh dán. Bóng đổ vào trong + bo nhẹ
     làm nó ra chất giấy in hơn. */
  .mv-edge { position: absolute; left: 130px; right: 130px; top: 300px; bottom: 760px;
             border-radius: 3px; pointer-events: none;
             box-shadow: inset 0 0 44px rgba(90,78,58,.38), inset 0 0 6px rgba(60,50,36,.5),
                         0 18px 46px rgba(120,105,80,.22); }
  /* ===== BẢN NGANG ===== */
  #capzone { bottom: 64px; }
  .ink-wrap { left: 260px; right: 260px; top: 170px; height: 640px; align-items: center; text-align: center; }
  .ink-key { font-size: 96px; } .ink-key.long { font-size: 78px; } .ink-key.xlong { font-size: 60px; }
  .ink-seal { width: 64px; height: 64px; margin-top: 40px; }
  /* Ô tranh giữa khung, chừa đáy cho phụ đề. 960px ngang (bản đầu) nhìn như
     ảnh tem trên tờ giấy trống -- video dài sống bằng hình, nên ô phải lớn. */
  .mv-mat { border-width: 110px 300px 250px 300px; }
  .mv-edge { left: 300px; right: 300px; top: 110px; bottom: 250px; }
  /* Biến màu cho các cảnh của video dài trên nền giấy. --lf-shade là màu GIẤY:
     phụ đề nền giấy là chữ mực tối, đổ bóng tối dưới đáy ảnh làm chữ chìm mất. */
  :root { --lf-theme: paper; --lf-fg: #1d1a16; --lf-muted: #6b6254; --lf-panel: rgba(250, 246, 236, .94);
          --lf-line: rgba(90, 70, 50, .45); --lf-shade: 239, 232, 216; --lf-node: #f3eee2;
          --lf-edge: rgba(140, 47, 34, .35);
          --lf-marker: rgba(236, 196, 64, .5); --lf-ink: #8c2f22;
          --lf-map-fill: rgba(140, 47, 34, .12); --lf-map-ctx: rgba(60, 40, 20, .05); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <div class="bedrock" id="blot"></div>
  <svg class="bedrock grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock" id="edge"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-ink"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script src="./longform.js"></script>
<script>
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "ink-wrap");
    const key = HF.el("div", "ink-key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 28) key.classList.add("xlong"); else if (L > 15) key.classList.add("long");
    w.appendChild(key);
    // Video dài có hàng chục cảnh -- số thứ tự trên dấu son thành vô nghĩa.
    w.appendChild(HF.el("div", "ink-seal card-box"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    const key = inner.querySelector(".ink-key");
    tl.fromTo(key, { opacity: 0, filter: "blur(26px)", y: 22 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 1.1, ease: "power2.out" }, ln.start);
    tl.fromTo(inner.querySelector(".ink-seal"), { opacity: 0, scale: .82 },
      { opacity: 1, scale: 1, duration: .7, ease: "power2.out" }, ln.start + .5);
  },
  transition(tl, oldS, newS, T) {
    tl.to(oldS, { opacity: 0, filter: "blur(16px)", duration: .8, ease: "sine.inOut" }, T);
    tl.fromTo(newS, { opacity: 0, filter: "blur(20px)" },
      { opacity: 1, filter: "blur(0px)", duration: .95, ease: "sine.out" }, T + .2);
  },
  ambient(tl, DUR) {
    tl.fromTo("#progress", { width: 0 }, { width: 1920, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .9, duration: 1.2 }, .4);
    tl.fromTo("#blot", { scale: .82, opacity: .55, x: -40 },
      { scale: 1.18, opacity: .9, x: 30, duration: DUR, ease: "none" }, 0);
  },
  buildMediaScene(inner, ln, i, n) {
    inner.appendChild(HF.el("div", "mv-mat"));
    inner.appendChild(HF.el("div", "mv-edge"));
  },
  enterMedia(tl, inner, ln) {
    // KHÔNG fade tấm giấy: nó phải có sẵn từ khung hình đầu, nếu không ảnh
    // sẽ loé ra phủ kín khung trước khi giấy kịp che.
    tl.fromTo(inner.querySelector(".mv-edge"), { opacity: 0 },
      { opacity: 1, duration: 1.1, ease: "sine.out" }, ln.start + .3);
  },
};
HF.build();
</script>
</body>
</html>
