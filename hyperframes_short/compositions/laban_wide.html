<!doctype html>
<html lang="vi" data-resolution="landscape" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#d4a93a"},
  {"id":"kicker","type":"string","label":"Kicker","default":"PHONG THỦY"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./wide.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===== LA BÀN: nền chàm đêm, những vòng khắc vàng quay rất chậm =====
     Hình tượng trung tâm của phong thuỷ là chiếc la bàn: vòng tròn đồng
     tâm, vạch chia đều. Vẽ bằng SVG thuần -- không chữ, không quẻ, để khỏi
     phải bảo đảm độ chính xác của từng ký hiệu (sơ đồ thật lấy từ thư viện
     biểu tượng đã vẽ theo dữ liệu tra cứu). */
  #capzone { bottom: 250px; }
  .progress { height: 4px; background: var(--accent); opacity: .7; box-shadow: 0 0 22px var(--accent); }
  #bed { background: radial-gradient(120% 80% at 50% 40%, #16204a 0%, #0b1130 48%, #060919 100%); }
  #rings { position: absolute; left: 40px; top: 300px; width: 1000px; height: 1000px; opacity: .2; }
  .grain { opacity: .12; }
  #kicker { color: #e9d9a8; } #footer { color: #6b6a86; }
  .lb-wrap { position: absolute; left: 110px; right: 110px; top: 560px; height: 600px;
             display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .lb-key { font-weight: 800; font-size: 96px; line-height: 1.12; color: #f3e6c0;
            letter-spacing: -.01em; text-shadow: 0 0 60px rgba(212,169,58,.25), 0 22px 60px rgba(0,0,0,.8); }
  .lb-key.long { font-size: 74px; } .lb-key.xlong { font-size: 58px; }
  .lb-rule { width: 0; height: 3px; margin: 34px auto 0; background: var(--accent);
             box-shadow: 0 0 18px var(--accent); }
  /* Màn ảnh: nhìn qua một mặt la bàn tròn. Ngoài vòng là nền chàm đặc. */
  .mv-lens { position: absolute; left: 150px; top: 330px; width: 780px; height: 780px;
             border-radius: 50%; pointer-events: none;
             box-shadow: 0 0 0 9999px #080c22, inset 0 0 80px rgba(8,12,34,.85); }
  .mv-ring { position: absolute; left: 132px; top: 312px; width: 816px; height: 816px;
             border-radius: 50%; border: 3px solid var(--accent); opacity: .85;
             box-shadow: 0 0 30px rgba(212,169,58,.35); pointer-events: none; }
  .mv-ticks { position: absolute; left: 112px; top: 292px; width: 856px; height: 856px; opacity: .55; }
  /* ===== BẢN NGANG ===== */
  #capzone { bottom: 64px; }
  #rings { left: 460px; top: -40px; width: 1000px; height: 1000px; }
  .lb-wrap { left: 240px; right: 240px; top: 170px; height: 600px; }
  .lb-key { font-size: 92px; } .lb-key.long { font-size: 76px; } .lb-key.xlong { font-size: 60px; }
  .mv-lens { left: 580px; top: 64px; width: 760px; height: 760px; box-shadow: 0 0 0 9999px #080c22, inset 0 0 70px rgba(8,12,34,.85); }
  .mv-ring { left: 564px; top: 48px; width: 792px; height: 792px; }
  .mv-ticks { left: 546px; top: 30px; width: 828px; height: 828px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <svg id="rings" viewBox="-500 -500 1000 1000"></svg>
  <svg class="bedrock grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="4"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-gold"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script>
function ticks(svg, r, n, len, w) {
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", c * r); l.setAttribute("y1", s * r);
    l.setAttribute("x2", c * (r - len)); l.setAttribute("y2", s * (r - len));
    l.setAttribute("stroke", "#d4a93a"); l.setAttribute("stroke-width", w);
    svg.appendChild(l);
  }
}
function ring(svg, r, w, dash) {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("r", r); c.setAttribute("fill", "none"); c.setAttribute("stroke", "#d4a93a");
  c.setAttribute("stroke-width", w); if (dash) c.setAttribute("stroke-dasharray", dash);
  svg.appendChild(c);
}
(function drawRings() {
  const s = document.getElementById("rings");
  ring(s, 490, 3); ring(s, 470, 1); ticks(s, 470, 72, 16, 1.5);
  ring(s, 400, 2); ticks(s, 400, 24, 34, 2.5); ring(s, 330, 1, "6 10");
  ring(s, 250, 2); ticks(s, 250, 8, 60, 3); ring(s, 80, 2); ring(s, 12, 6);
})();
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "lb-wrap card-box");
    const key = HF.el("div", "lb-key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 28) key.classList.add("xlong"); else if (L > 15) key.classList.add("long");
    w.appendChild(key);
    w.appendChild(HF.el("div", "lb-rule"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".lb-key"), { opacity: 0, scale: .94 },
      { opacity: 1, scale: 1, duration: .8, ease: "power2.out" }, ln.start);
    tl.fromTo(inner.querySelector(".lb-rule"), { width: 0 },
      { width: 220, duration: .9, ease: "power2.out" }, ln.start + .25);
  },
  transition(tl, oldS, newS, T) {
    tl.to(oldS, { opacity: 0, scale: 1.04, duration: .55, ease: "power1.in" }, T);
    tl.fromTo(newS, { opacity: 0 }, { opacity: 1, duration: .6, ease: "power1.out" }, T + .2);
  },
  ambient(tl, DUR) {
    tl.fromTo("#progress", { width: 0 }, { width: 1920, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .9, duration: 1.0 }, .3);
    // La bàn quay rất chậm: cảm giác đang dò hướng, không phải bánh xe quay.
    tl.fromTo("#rings", { rotation: 0, opacity: .12 }, { rotation: 24, opacity: .22, duration: DUR, ease: "none" }, 0);
  },
  buildMediaScene(inner, ln) {
    inner.appendChild(HF.el("div", "mv-lens"));
    const t = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    t.setAttribute("class", "mv-ticks"); t.setAttribute("viewBox", "-430 -430 860 860");
    ticks(t, 428, 72, 12, 1.5); ticks(t, 428, 8, 26, 3);
    inner.appendChild(t);
    inner.appendChild(HF.el("div", "mv-ring"));
  },
  enterMedia(tl, inner, ln) {
    // Mặt kính có SẴN; chỉ vòng khắc vàng quay nhẹ vào vị trí.
    tl.fromTo(inner.querySelector(".mv-ticks"), { rotation: -12, opacity: 0 },
      { rotation: 0, opacity: .55, duration: 1.2, ease: "power2.out" }, ln.start);
  },
};
HF.build();
</script>
</body>
</html>
