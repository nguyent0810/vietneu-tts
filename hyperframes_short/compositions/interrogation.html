<!doctype html>
<html lang="vi" data-resolution="portrait" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#8fb8d8"},
  {"id":"kicker","type":"string","label":"Kicker","default":"HỒ SƠ"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===== PHÒNG THẨM VẤN — một vũng đèn duy nhất, còn lại nuốt vào bóng tối ===== */
  #bed { background: #050608; }
  #lamp { position: absolute; left: 50%; top: -260px; width: 1500px; height: 1500px; margin-left: -750px;
          background: radial-gradient(circle at 50% 50%, rgba(214,232,247,.40) 0%, rgba(150,185,215,.14) 34%, rgba(0,0,0,0) 62%); }
  #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 760px; opacity: .5;
           background: repeating-linear-gradient(97deg, rgba(150,185,215,.10) 0 2px, rgba(0,0,0,0) 2px 86px); }
  .word-wrap { position: absolute; left: 80px; right: 80px; top: 520px; height: 640px;
               display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .word-wrap .tag { font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: .3em;
                    color: rgba(190,214,235,.55); margin-bottom: 38px; }
  .word-wrap .key { font-weight: 800; font-size: 122px; line-height: 1.02; letter-spacing: -.02em;
                    color: #eef4fa; text-transform: uppercase; text-shadow: 0 34px 60px rgba(0,0,0,.9); }
  .word-wrap .key.long  { font-size: 94px; }
  .word-wrap .key.xlong { font-size: 70px; line-height: 1.12; }
  .word-wrap .under { margin-top: 42px; height: 3px; width: 320px; background: linear-gradient(90deg, rgba(0,0,0,0), var(--accent), rgba(0,0,0,0)); }
  #haze { position: absolute; inset: 0; background: radial-gradient(60% 36% at 50% 34%, rgba(190,214,235,.09), rgba(0,0,0,0) 70%); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <div id="lamp"></div>
  <div id="floor"></div>
  <div id="haze"></div>
  <svg class="bedrock grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette" id="vig"></div>
  <div id="stage"></div>
  <div id="capzone" class="skin-pill"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script>
window.HF_STYLE = {
  buildScene(inner, ln, i, n) {
    const w = HF.el("div", "word-wrap card-box");
    w.appendChild(HF.el("div", "tag", "LỜI KHAI " + String(i + 1).padStart(2, "0") + " / " + String(n).padStart(2, "0")));
    const key = HF.el("div", "key", (ln.key_parts || []).map(p => p.t).join(" "));
    const L = key.textContent.length;
    if (L > 30) key.classList.add("xlong"); else if (L > 16) key.classList.add("long");
    w.appendChild(key);
    w.appendChild(HF.el("div", "under"));
    inner.appendChild(w);
  },
  enter(tl, inner, ln) {
    const w = inner.querySelector(".word-wrap");
    tl.fromTo(w.querySelector(".tag"), { opacity: 0, letterSpacing: "0.6em" },
      { opacity: 1, letterSpacing: "0.3em", duration: .7, ease: "power3.out" }, ln.start);
    tl.fromTo(w.querySelector(".key"), { opacity: 0, scale: 1.06, filter: "blur(16px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: .72, ease: "power3.out" }, ln.start + .06);
    tl.fromTo(w.querySelector(".under"), { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: .6, ease: "power2.out" }, ln.start + .3);
    tl.fromTo(w, { y: 26 }, { y: -14, duration: Math.max(.8, ln.end - ln.start), ease: "none" }, ln.start);
  },
  transition(tl, oldS, newS, T) {          // focus pull: mất nét rồi bắt nét cảnh mới
    tl.to(oldS, { opacity: 0, filter: "blur(22px)", scale: 1.04, duration: .36, ease: "power2.in" }, T);
    tl.fromTo(newS, { opacity: 0, filter: "blur(26px)", scale: .98 },
      { opacity: 1, filter: "blur(0px)", scale: 1, duration: .46, ease: "power2.out" }, T + .08);
  },
  ambient(tl, DUR, { rand }) {
    tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .7, ease: "power3.out" }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .92, duration: .7 }, .22);
    // đèn đung đưa + chập chờn: nhịp cố định, số lần lặp hữu hạn
    tl.fromTo("#lamp", { x: -60, opacity: .92 }, { x: 60, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
    const cycle = 3.4, reps = Math.max(0, Math.floor(DUR / cycle) - 1);
    tl.to("#haze", { opacity: .55, duration: cycle / 2, ease: "sine.inOut", yoyo: true, repeat: reps }, 0);
    for (let k = 0; k < 3; k++) {          // nháy đèn ở 3 mốc rải đều
      const at = (DUR / 4) * (k + 1) + rand() * .4;
      tl.to("#lamp", { opacity: .55, duration: .05 }, at);
      tl.to("#lamp", { opacity: 1, duration: .12 }, at + .06);
    }
  }
};
HF.build();
</script>
</body>
</html>
