<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>MIM - Thước đo điện ảnh viễn tưởng (Anamorphic Sci-Fi Slate)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <script>
    if (window.location.search.includes('static')) {
      document.documentElement.classList.add('is-static');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #04070d;
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      color: #e6f1ff;
      -webkit-font-smoothing: antialiased;
    }

    /* Chế độ tĩnh khi URL có ?static */
    html.is-static *,
    html.is-static *::before,
    html.is-static *::after {
      animation: none !important;
      transition: none !important;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #04070d;
      overflow: hidden;
    }

    /* Background image & tech grid */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.32;
      filter: saturate(1.2) brightness(0.65) hue-rotate(5deg);
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(125,211,252,.06) 1px, transparent 1px) 0 0 / 60px 60px,
        linear-gradient(90deg, rgba(125,211,252,.06) 1px, transparent 1px) 0 0 / 60px 60px,
        radial-gradient(120% 70% at 50% 18%, #0f2236 0%, #081221 55%, #04070d 100%);
    }
    .bg-vig {
      position: absolute;
      inset: 0;
      background: radial-gradient(115% 85% at 50% 45%, transparent 55%, rgba(0,0,0,.8) 100%);
      pointer-events: none;
    }

    /* Kicker (Top Header) */
    #kicker {
      position: absolute;
      left: 64px;
      top: 96px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 50;
    }
    #kicker .bar {
      width: 12px;
      height: 48px;
      background: #22d3ee;
      border-radius: 4px;
      box-shadow: 0 0 18px rgba(34,211,238,.65);
    }
    #kicker .t {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .24em;
      white-space: nowrap;
      color: #e6f1ff;
    }
    #kicker .t small {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: .2em;
      color: #7f93ad;
      margin-top: 4px;
    }

    /* --- ĐỀ XUẤT KIỂU NHÃN 3 (MIM): THƯỚC ĐO ĐIỆN ẢNH VIỄN TƯỞNG (ANAMORPHIC SCI-FI SLATE) --- */
    /* Vùng an toàn: width 820px, x_max = 64 + 820 = 884px < 900px, không đè nút bên phải */
    .hypo-slate-wrap {
      position: absolute;
      left: 64px;
      width: 820px;
      top: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 60;
      animation: anamorphicReveal 0.6s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }
    .hypo-slate {
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(8,18,33,0.95) 15%, rgba(8,18,33,0.95) 85%, transparent 100%);
      border-top: 2px solid rgba(34, 211, 238, 0.6);
      border-bottom: 2px solid rgba(34, 211, 238, 0.6);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6), 0 0 30px rgba(34,211,238,0.2);
    }
    .hypo-slate .tech-tag {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.28em;
      color: #7dd3fc;
      text-transform: uppercase;
    }
    .hypo-slate .title {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 900;
      font-size: 64px;
      line-height: 1.1;
      letter-spacing: 0.08em;
      color: #e6f8ff;
      text-shadow: 0 0 25px rgba(34,211,238,0.65), 0 4px 20px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    @keyframes anamorphicReveal {
      0% { opacity: 0; transform: scaleX(0.9); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    /* Scene Center Content: Cảnh kinetic công nghệ cao */
    .scene-content {
      position: absolute;
      left: 64px;
      right: 64px;
      top: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    .kinetic-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .kin-line-1 {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 900;
      font-size: 92px;
      line-height: 1.05;
      text-align: center;
      color: #22d3ee;
      text-shadow: 0 0 40px rgba(34,211,238,0.5);
    }
    .kin-line-2 {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 800;
      font-size: 56px;
      line-height: 1.2;
      text-align: center;
      color: #cfe3f5;
    }

    /* Subtitle at bottom safe zone (top: 1478px, 62px) */
    #caps {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 1478px;
      height: 200px;
      z-index: 60;
      text-align: center;
    }
    .cap {
      font-weight: 800;
      font-size: 62px;
      line-height: 1.25;
      color: #fff;
      text-shadow: 0 6px 28px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.9);
    }
    .cap .acc {
      color: #22d3ee;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img class="bg-image" src="../../../motion/hf/assets/clips/sheets/abstract-technology.jpg" alt="background" />
    <div class="bg-grid"></div>
    <div class="bg-vig"></div>

    <!-- Kicker -->
    <div id="kicker">
      <div class="bar"></div>
      <div class="t">
        MÔ HÌNH HỌC MÁY
        <small>MÔ PHỎNG DỮ LIỆU ĐẦU VÀO</small>
      </div>
    </div>

    <!-- ĐỀ XUẤT NHÃN: THƯỚC ĐO ĐIỆN ẢNH VIỄN TƯỞNG (≥ 62px, chuẩn 64px) -->
    <div class="hypo-slate-wrap">
      <div class="hypo-slate">
        <div class="tech-tag">◈ SỐ LIỆU MINH HOẠ ◈</div>
        <div class="title">VÍ DỤ GIẢ ĐỊNH</div>
      </div>
    </div>

    <!-- Nội dung chính -->
    <div class="scene-content">
      <div class="kinetic-box">
        <div class="kin-line-1">THUẬT TOÁN HỌC</div>
        <div class="kin-line-2">từ 12 kịch bản mô phỏng trước khi vào đời thực</div>
      </div>
    </div>

    <!-- Subtitle (dòng phụ 62px) -->
    <div id="caps">
      <div class="cap">
        Trong <span class="acc">kịch bản giả định</span>, mô hình dự đoán chính xác chín mươi phần trăm.
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const el = document.querySelector('.hypo-slate .title');
      const wrap = document.querySelector('.hypo-slate-wrap');
      if (el && wrap) {
        const cs = window.getComputedStyle(el);
        const r = wrap.getBoundingClientRect();
        const m = document.createElement('div');
        m.id = '__computed_metrics__';
        m.style.display = 'none';
        m.textContent = JSON.stringify({
          target: 'mim_anamorphic_slate',
          fontSize: cs.fontSize,
          fontFamily: cs.fontFamily,
          fontWeight: cs.fontWeight,
          labelLeft: r.left,
          labelTop: r.top,
          labelRight: r.right,
          labelBottom: r.bottom,
          labelWidth: r.width,
          labelHeight: r.height
        });
        document.body.appendChild(m);
      }
    });
  </script>
</body>
</html>
