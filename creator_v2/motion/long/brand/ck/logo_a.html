<!doctype html><html lang="vi"><head><meta charset="UTF-8" />

<!-- Logo "Biểu Đồ Biết Nói" (bản A, 06/10/2026): bong bóng thoại viền vàng chuyển sắc (vàng = giá tham chiếu trên
