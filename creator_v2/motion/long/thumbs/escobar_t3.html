<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&family=Literata:wght@900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#1d150c}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#f2e7cf}
.glow{position:absolute;border-radius:50%;filter:blur(110px);background:rgba(242,207,134,.35)}
.big{position:absolute;font-weight:900;line-height:.88;white-space:nowrap;color:#e39a2d;text-shadow:0 12px 40px #000}
.tag{position:absolute;font-family:'Literata',serif;font-weight:900;letter-spacing:.2em;color:#f2cf86;white-space:nowrap}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="glow" style="left:400px;bottom:-200px;width:1100px;height:700px"></div>
<div class="tag" style="left:120px;top:200px;font-size:48px">THÁNG 4 · 2026</div>
<div class="big" style="left:90px;top:320px;font-size:240px">DÒNG SÔNG</div>
<div class="tag" style="left:120px;top:880px;font-size:48px">MAGDALENA</div>
<svg class="grain" width="1920" height="1080"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="2"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</div><script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
