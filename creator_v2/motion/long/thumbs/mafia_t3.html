<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&family=Playfair+Display:wght@900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#050404}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff}
.abs{position:absolute}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay}
.glow{position:absolute;border-radius:50%;filter:blur(100px);background:rgba(200,16,46,.6)}
.brand{position:absolute;font-family:'Playfair Display';font-weight:900;color:#ff2a3d;line-height:.9;white-space:nowrap;
  text-shadow:0 0 60px rgba(255,20,40,.55),0 14px 40px #000,-5px -5px 0 #000,5px 5px 0 #000}
.big{position:absolute;font-weight:900;line-height:1;white-space:nowrap;text-shadow:0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.tag{position:absolute;font-family:'JetBrains Mono';font-weight:700;letter-spacing:.25em;color:#ff6a6a;white-space:nowrap}
</style></head><body>
<!-- T3: Totò Riina cười, tay còng + "CON THÚ" -->
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<img class="abs" src="assets/long/mafia/img/riina.jpg" style="left:40px;top:-60px;width:960px;height:1300px;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.4) brightness(.95)"/>
<div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(5,4,4,.2) 0%,rgba(5,4,4,0) 20%,rgba(5,4,4,.2) 42%,rgba(5,4,4,.96) 54%,#050404 64%)"></div>
<div class="glow" style="left:1040px;top:220px;width:820px;height:460px"></div>
<div class="big" style="left:1020px;top:170px;font-size:110px;color:#fff">TOTÒ RIINA</div>
<div class="brand" style="left:1000px;top:350px;font-size:178px">CON THÚ</div>
<div class="big" style="left:1020px;top:640px;font-size:110px;color:#ffd23a">TRỐN 23 NĂM</div>
<div class="tag" style="left:1040px;top:830px;font-size:36px">ÔNG TRÙM CỦA CÁC ÔNG TRÙM</div>
<svg class="grain" width="1920" height="1080"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</div><script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
