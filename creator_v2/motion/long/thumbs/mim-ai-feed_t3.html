<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#02050a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.big{position:absolute;font-weight:900;line-height:1.02;white-space:nowrap;text-shadow:0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.cy{color:#22d3ee;text-shadow:0 0 50px rgba(34,211,238,.75),0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.phone{position:absolute;left:1180px;top:70px;width:520px;height:940px;border-radius:70px;background:#0b1626;border:14px solid #1e2b3d;box-shadow:0 40px 120px #000,0 0 120px rgba(34,211,238,.25);overflow:hidden;transform:rotate(5deg)}
.card{position:absolute;left:26px;right:26px;border-radius:28px;background:linear-gradient(160deg,#16314d,#0d1d31)}
.play{position:absolute;left:50%;top:50%;width:0;height:0;margin:-40px 0 0 -26px;border-left:70px solid rgba(230,241,255,.45);border-top:40px solid transparent;border-bottom:40px solid transparent}
.menu{position:absolute;left:1020px;top:560px;width:640px;padding:18px 0;border-radius:28px;background:#f1f5f9;color:#0f172a;box-shadow:0 30px 90px #000,0 0 0 6px #000;transform:rotate(-3deg)}
.menu div{padding:22px 40px;font-size:52px;font-weight:800}
.menu .on{background:#22d3ee;color:#02050a}
.hand{position:absolute;left:1500px;top:640px;filter:drop-shadow(0 20px 30px #000)}
</style></head><body>
<!-- T3: điện thoại bảng tin chung chung + menu MÔ PHỎNG (chữ "Không quan tâm", không logo) + ngón tay cái bấm; chữ "DẠY LẠI / BẢNG TIN" -->
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="grid"></div>
<div class="glow" style="left:1100px;top:250px;width:700px;height:700px;background:rgba(34,211,238,.28)"></div>
<div class="glow" style="left:60px;top:300px;width:800px;height:500px;background:rgba(56,189,248,.16)"></div>
<div class="phone">
  <div class="card" style="top:40px;height:520px"><div class="play"></div></div>
  <div class="card" style="top:590px;height:400px"><div class="play"></div></div>
</div>
<div class="menu"><div class="on">Không quan tâm</div><div style="color:#64748b">Chia sẻ</div></div>
<svg class="hand" width="300" height="300" viewBox="0 0 24 24"><path fill="#22d3ee" stroke="#02050a" stroke-width=".6" transform="rotate(180 12 12)" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
<div class="big" style="left:90px;top:220px;font-size:220px">DẠY LẠI</div>
<div class="big cy" style="left:90px;top:480px;font-size:200px">BẢNG TIN</div>
<div class="big" style="left:90px;top:730px;font-size:96px">CỦA BẠN</div>
</div>
<script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
