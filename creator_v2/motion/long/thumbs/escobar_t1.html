<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&family=Literata:wght@900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#1d150c}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#f2e7cf}
.glow{position:absolute;border-radius:50%;filter:blur(110px);background:rgba(227,154,45,.55)}
.big{position:absolute;font-weight:900;line-height:1.05;white-space:nowrap;color:#f2cf86;text-shadow:0 18px 40px #000}
.tag{position:absolute;font-family:'Be Vietnam Pro',sans-serif;font-weight:800;letter-spacing:.12em;color:#e39a2d;white-space:nowrap}
.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="glow" style="left:200px;top:180px;width:1400px;height:800px"></div>
<div class="tag" style="left:120px;top:160px;font-size:52px">BỐN CON · 1981</div>
<div class="big" style="left:100px;top:300px;font-size:250px">HÀ MÃ</div>
<div class="tag" style="left:120px;top:820px;font-size:48px">SÔNG MAGDALENA</div>
<svg class="grain" width="1920" height="1080"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</div><script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
