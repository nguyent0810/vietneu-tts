<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#02050a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff}
.abs{position:absolute}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px}
.glow{position:absolute;border-radius:50%;filter:blur(120px);background:rgba(34,211,238,.45)}
.big{position:absolute;font-weight:900;line-height:.95;white-space:nowrap;text-shadow:0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.cy{color:#22d3ee;text-shadow:0 0 50px rgba(34,211,238,.75),0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.yl{color:#fde047}
.tag{position:absolute;font-family:'JetBrains Mono';font-weight:700;letter-spacing:.22em;color:#7dd3fc;white-space:nowrap;text-shadow:0 4px 20px #000}
.name{position:absolute;background:#e11d48;color:#fff;font-weight:900;padding:14px 34px;border-radius:10px;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.7);transform:rotate(-4deg)}
.bub{position:absolute;padding:34px 48px;border-radius:34px;font-weight:900;white-space:nowrap;box-shadow:0 30px 80px #000}
.u{background:#e6f1ff;color:#0a1422;border-bottom-right-radius:8px}
.m{background:#0f1b2d;color:#22d3ee;border:4px solid #22d3ee;border-bottom-left-radius:8px;font-family:'JetBrains Mono';box-shadow:0 0 70px rgba(34,211,238,.55),0 30px 80px #000}
.cur{display:inline-block;width:.5em;height:.9em;background:#22d3ee;vertical-align:-.08em;margin-left:.12em;box-shadow:0 0 30px #22d3ee}
</style></head><body>
<!-- T1: "máy tính" NACA 1952 (PD) + thẻ tên đỏ "MÁY TÍNH" + ô chat cyan — "AI CƯỚP VIỆC?" -->
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="grid"></div>
<img class="abs" src="assets/long/mim-ai-jobs/img/x4.jpg" style="left:0;top:0;width:1000px;height:1080px;object-fit:cover;object-position:28% 40%;filter:grayscale(1) contrast(1.5) brightness(1.02)"/>
<div class="abs" style="left:0;top:0;width:1000px;height:1080px;background:linear-gradient(90deg,rgba(2,5,10,0) 50%,#02050a 100%)"></div>
<div class="name" style="left:90px;top:120px;font-size:76px">MÁY TÍNH</div>
<div class="tag" style="left:96px;top:960px;font-size:44px;color:#e6f1ff">NGHỀ · 1952</div>
<div class="glow" style="left:1020px;top:180px;width:820px;height:420px"></div>
<div class="bub m" style="left:1010px;top:150px;font-size:66px">lần này khác<span class="cur"></span></div>
<div class="big" style="left:960px;top:470px;font-size:210px">AI CƯỚP</div>
<div class="big cy" style="left:960px;top:690px;font-size:210px">VIỆC?</div>
</div><script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
