<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#02050a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.card{position:absolute;width:640px;height:230px;border-radius:26px;background:linear-gradient(160deg,#1b2a3f,#0b1626);border:10px solid #22d3ee;
 box-shadow:0 30px 90px #000,0 0 90px rgba(34,211,238,.35)}
.fan{position:absolute;top:35px;width:160px;height:160px;border-radius:50%;border:12px solid #334155;background:radial-gradient(circle,#0b1626 0 30%,#1e293b 31% 100%)}
.big{position:absolute;font-weight:900;line-height:1.04;white-space:nowrap;text-shadow:0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
.cy{color:#22d3ee;text-shadow:0 0 50px rgba(34,211,238,.75),0 10px 40px #000,-6px -6px 0 #000,6px 6px 0 #000,6px -6px 0 #000,-6px 6px 0 #000}
</style></head><body>
<!-- T2: hai card đồ hoạ vẽ tay (không logo) + "2 CARD GAME / KHỞI ĐẦU AI" -->
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="grid"></div>
<div class="glow" style="left:1050px;top:250px;width:760px;height:600px;background:rgba(34,211,238,.25)"></div>
<div class="card" style="left:1160px;top:230px;transform:rotate(-6deg)"><div class="fan" style="left:60px"></div><div class="fan" style="left:250px"></div></div>
<div class="card" style="left:1120px;top:560px;transform:rotate(4deg)"><div class="fan" style="left:60px"></div><div class="fan" style="left:250px"></div></div>
<div class="big" style="left:80px;top:170px;font-size:190px">2 CARD</div>
<div class="big" style="left:80px;top:380px;font-size:190px">GAME</div>
<div class="big cy" style="left:80px;top:620px;font-size:140px">KHỞI ĐẦU AI</div>
</div>
<script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
