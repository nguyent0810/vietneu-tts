<!doctype html><html lang="vi"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#02050a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff}
.abs{position:absolute}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px) 0 0/64px 64px}
.glow{position:absolute;border-radius:50%;filter:blur(120px);background:rgba(34,211,238,.45)}
.tag{position:absolute;font-family:'JetBrains Mono';font-weight:700;letter-spacing:.22em;color:#7dd3fc;white-space:nowrap;text-shadow:0 4px 20px #000}
.bub{position:absolute;padding:34px 48px;border-radius:34px;font-weight:900;white-space:nowrap;box-shadow:0 30px 80px #000}
.u{background:#e6f1ff;color:#0a1422;border-bottom-right-radius:8px}
.m{background:#0f1b2d;color:#22d3ee;border:4px solid #22d3ee;border-bottom-left-radius:8px;font-family:'JetBrains Mono';box-shadow:0 0 70px rgba(34,211,238,.55),0 30px 80px #000}
</style></head><body>
<!-- T3: Alan Turing 1951 (PD) + khung chat "Máy có thể suy nghĩ?" — "CÓ." -->
<div id="root" data-composition-id="main" data-start="0" data-duration="0.2" data-width="1920" data-height="1080" data-fps="30">
<div class="grid"></div>
<img class="abs" src="assets/long/mim-ai-70/img/turing.jpg" style="left:0;top:0;width:820px;height:1080px;object-fit:cover;object-position:50% 25%;filter:grayscale(1) contrast(1.4) brightness(1.05)"/>
<div class="abs" style="left:0;top:0;width:820px;height:1080px;background:linear-gradient(90deg,rgba(2,5,10,0) 55%,#02050a 100%)"></div>
<div class="glow" style="left:1000px;top:520px;width:800px;height:420px"></div>
<div class="tag" style="left:900px;top:140px;font-size:52px">1950 → 2025</div>
<div class="bub u" style="right:110px;top:270px;font-size:84px">Máy có thể<br/>suy nghĩ?</div>
<div class="bub m" style="left:900px;top:640px;font-size:190px;padding:20px 60px">CÓ.</div>
</div><script>window.__timelines={main:gsap.timeline({paused:true})};</script></body></html>
