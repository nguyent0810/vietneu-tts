<!doctype html>
<html lang="vi" data-resolution="portrait" data-composition-variables='[
  {"id":"accent","type":"color","label":"Accent","default":"#f59e0b"},
  {"id":"kicker","type":"string","label":"Kicker","default":"HỒ SƠ"},
  {"id":"badge","type":"string","label":"Badge","default":""},
  {"id":"footer","type":"string","label":"Footer","default":""},
  {"id":"duration","type":"number","label":"Duration","default":30},
  {"id":"narration","type":"string","label":"Narration","default":""},
  {"id":"bgm","type":"string","label":"BGM","default":""},
  {"id":"bgm_gain","type":"number","label":"BGM gain","default":0.16},
  {"id":"lines","type":"string","label":"Lines JSON","default":"[]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===== HIỆN TRƯỜNG ĐÊM — mưa, đèn vàng hắt, chiều sâu bằng lớp mờ ===== */
  #bed { background: linear-gradient(185deg, #0a1020 0%, #0a0c16 48%, #05060c 100%); }
  .halo { position: absolute; border-radius: 50%; filter: blur(2px); }
  #halo1 { left: -240px; top: 240px; width: 900px; height: 900px;
           background: radial-gradient(circle, rgba(245,158,11,.22) 0%, rgba(0,0,0,0) 64%); }
  #halo2 { right: -300px; top: 900px; width: 1000px; height: 1000px;
           background: radial-gradient(circle, rgba(56,110,190,.20) 0%, rgba(0,0,0,0) 64%); }
  .rain { position: absolute; width: 2px; border-radius: 2px;
          background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.42)); }
  .plate { position: absolute; left: 80px; right: 80px; top: 470px; min-height: 600px;
           display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
  .plate .stamp { display: inline-block; align-self: flex-start; font-family: 'JetBrains Mono', monospace;
                  font-size: 23px; letter-spacing: .2em; color: #0b0c10; background: var(--accent);
                  padding: 10px 20px; margin-bottom: 34px; }
  .plate .key { font-weight: 800; font-size: 116px; line-height: 1.03; text-transform: uppercase;
                color: #fdf6ec; letter-spacing: -.026em; text-shadow: 0 30px 70px rgba(0,0,0,.85); }
  .plate .key.long  { font-size: 90px; }
  .plate .key.xlong { font-size: 68px; line-height: 1.12; }
  .plate .mirror { margin-top: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: -.026em;
                   color: rgba(253,246,236,.13); transform: scaleY(-1); filter: blur(3px);
                   font-size: 116px; line-height: 1.03; mask-image: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .plate .mirror.long  { font-size: 90px; }
  .plate .mirror.xlong { font-size: 68px; line-height: 1.12; }

  /* ===== MÀN VIDEO: hiện trường nhìn qua mưa và đèn vàng ===== */
  .mv-grade { position: absolute; inset: 0;
              background: linear-gradient(180deg, rgba(10,16,32,.45), rgba(5,6,12,.82)); }
  .mv-warm { position: absolute; inset: 0;
             background: radial-gradient(70% 45% at 22% 32%, rgba(245,158,11,.22), rgba(0,0,0,0) 70%); }
  .mv-slug { position: absolute; left: 80px; top: 1108px; display: inline-block;
             font-family: 'JetBrains Mono', monospace; font-size: 23px; letter-spacing: .2em;
             color: #0b0c10; background: var(--accent); padding: 10px 20px; }
  .mv-key  { position: absolute; left: 80px; right: 80px; top: 1184px; font-weight: 800;
             font-size: 82px; line-height: 1.03; text-transform: uppercase; color: #fdf6ec;
             text-shadow: 0 30px 70px rgba(0,0,0,.9); }

  .mv-key.long { font-size: 64px; }
  .mv-key.xlong { font-size: 50px; line-height: 1.12; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
  <div class="bedrock" id="bed"></div>
  <div class="halo" id="halo1"></div>
  <div class="halo" id="halo2"></div>
  <div id="stage"></div>
  <div class="bedrock" id="rainbox"></div>
  <svg class="bedrock grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bedrock vignette"></div>
  <div id="capzone" class="skin-glow"></div>
  <div id="kicker-row"><div class="bar"></div><div id="kicker"></div></div>
  <div id="badge"></div>
  <div id="footer"></div>
  <div class="progress" id="progress"></div>
</div>
<script src="./engine.js"></script>
<script>
window.HF_STYLE = {
  buildMediaScene(inner, ln, i, n) {
    inner.appendChild(HF.el("div", "mv-grade"));
    inner.appendChild(HF.el("div", "mv-warm"));
    inner.appendChild(HF.el("div", "mv-slug", String(i + 1).padStart(2, "0") + " / " + String(n).padStart(2, "0") + "  ·  HIỆN TRƯỜNG"));
    const mvKey = HF.el("div", "mv-key", (ln.key_parts || []).map(p => p.t).join(" "));
    if (mvKey.textContent.length > 26) mvKey.classList.add("xlong");
    else if (mvKey.textContent.length > 14) mvKey.classList.add("long");
    inner.appendChild(mvKey);
  },
  enterMedia(tl, inner, ln) {
    tl.fromTo(inner.querySelector(".mv-grade"), { opacity: 0 }, { opacity: 1, duration: .6 }, ln.start);
    tl.fromTo(inner.querySelector(".mv-warm"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .9, ease: "sine.out" }, ln.start);
    tl.fromTo(inner.querySelector(".mv-slug"), { opacity: 0, x: -30, skewX: -12 },
      { opacity: 1, x: 0, skewX: 0, duration: .45, ease: "power3.out" }, ln.start + .18);
    tl.fromTo(inner.querySelector(".mv-key"), { opacity: 0, y: 34, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: .6, ease: "power3.out" }, ln.start + .26);
  },
  buildScene(inner, ln, i, n) {
    const p = HF.el("div", "plate card-box");
    p.appendChild(HF.el("div", "stamp", String(i + 1).padStart(2, "0") + " / " + String(n).padStart(2, "0") + "  ·  HIỆN TRƯỜNG"));
    const txt = (ln.key_parts || []).map(q => q.t).join(" ");
    const key = HF.el("div", "key", txt), mir = HF.el("div", "mirror", txt);
    const cls = txt.length > 30 ? "xlong" : (txt.length > 16 ? "long" : "");
    if (cls) { key.classList.add(cls); mir.classList.add(cls); }
    p.appendChild(key); p.appendChild(mir);
    inner.appendChild(p);
  },
  enter(tl, inner, ln) {
    const p = inner.querySelector(".plate");
    tl.fromTo(p.querySelector(".stamp"), { opacity: 0, x: -30, skewX: -12 },
      { opacity: 1, x: 0, skewX: 0, duration: .45, ease: "power3.out" }, ln.start);
    tl.fromTo([p.querySelector(".key"), p.querySelector(".mirror")], { opacity: 0, y: 40, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: .6, ease: "power3.out", stagger: .04 }, ln.start + .08);
    tl.fromTo(p, { x: 0 }, { x: -26, duration: Math.max(.8, ln.end - ln.start), ease: "none" }, ln.start);
  },
  transition(tl, oldS, newS, T) {          // vệt sáng quét qua rồi đổi cảnh
    tl.to(oldS, { opacity: 0, filter: "brightness(1.9) blur(6px)", duration: .3, ease: "power2.in" }, T);
    tl.fromTo(newS, { opacity: 0, filter: "brightness(2.2) blur(10px)", y: 30 },
      { opacity: 1, filter: "brightness(1) blur(0px)", y: 0, duration: .44, ease: "power2.out" }, T + .1);
  },
  ambient(tl, DUR, { rand }) {
    tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#kicker-row", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .7, ease: "power3.out" }, 0);
    tl.fromTo("#badge", { opacity: 0 }, { opacity: .92, duration: .7 }, .22);
    tl.fromTo("#halo1", { x: -50, opacity: .8 }, { x: 40, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
    tl.fromTo("#halo2", { x: 50 }, { x: -50, duration: DUR, ease: "sine.inOut" }, 0);
    const box = document.getElementById("rainbox");
    for (let k = 0; k < 46; k++) {         // mưa: mỗi vệt 1 tween rơi lặp hữu hạn
      const r = HF.el("div", "rain");
      const len = 60 + rand() * 120, x = rand() * 1120 - 20;
      r.style.height = len + "px"; r.style.left = x + "px"; r.style.top = "-200px";
      r.style.opacity = String(.25 + rand() * .5);
      r.style.transform = "rotate(9deg)";
      box.appendChild(r);
      const fall = .8 + rand() * .7, reps = Math.max(0, Math.floor(DUR / fall) - 1);
      tl.fromTo(r, { y: -200 }, { y: 2120, duration: fall, ease: "none", repeat: reps }, rand() * fall);
    }
  }
};
HF.build();
</script>
</body>
</html>
