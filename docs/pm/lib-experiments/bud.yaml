    bang_chung: "Plan L_bud_culapanthaka đã có; outcome và retention riêng UNKNOWN (lấy: Studio → Analytics → video ID → Giữ chân người xem và Phạm vi tiếp cận, export CSV). Ngoài Đời Thật đã thử nên đây là giả thuyết phân lớp nguồn, không phải thử lại format nguyên xi."
    quyet_dinh: gop_vao_064-BUD-01
