name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      # Nhánh feat/**: dùng uv.lock nguyên trạng (--frozen). uv.lock tham chiếu
      # wheel llama-cpp-python cho Windows mà URL phát hành đã trả 404, nên mọi
      # lần resolve lại lock đều hỏng trước khi kịp chạy test (đồng thời lock
      # đó không cần cho group dev). Job của main giữ nguyên hành vi cũ.
      - name: Install dependencies
        env:
          UV_FROZEN: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'main' && '1' || '0' }}
        run: |
          uv sync --group dev
          uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        # Nhánh feat/**: bật binary giả cho external_bin (runner Ubuntu không có
        # codex/rclone/osascript). Job của main giữ nguyên hành vi cũ.
        env:
          VIETNEU_TEST_STUB_BINARIES: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'main' && '1' || '' }}
          UV_FROZEN: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'main' && '1' || '0' }}
        run: uv run pytest -v --tb=short
